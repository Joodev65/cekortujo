<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAQuiz – Latihan Soal Olimpiade</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5zM4 19a2 2 0 012-2h13"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 6l3 3"/></symbol>
<symbol id="i-eraser" viewBox="0 0 24 24"><path d="M3 16l9-9a2 2 0 013 0l4 4a2 2 0 010 3l-5 5H8l-5-3zM10 21h11"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="i-spk" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9l5 6M22 9l-5 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4 19a2 2 0 002 3h12a2 2 0 002-3l-6-10V3"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></symbol>
<symbol id="i-sig" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
<symbol id="s0" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></symbol>
<symbol id="s1" viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></symbol>
<symbol id="s2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
<symbol id="s3" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></symbol>
</defs></svg>

<div class="wrap">
<section id="s-welcome" class="screen on"><div>
  <div class="tw" id="tw"></div>
  <form id="nickbox" autocomplete="off">
    <label class="l" for="nick" style="text-align:center">Siapa nama panggilanmu?</label>
    <input id="nick" maxlength="16" placeholder="Masukkan nickname">
    <div class="err" id="nerr"></div>
    <button class="btn yel full" type="submit">Mulai</button>
  </form>
</div></section>

<section id="s-dash" class="screen">
  <div class="hud">
    <button class="av" id="av" title="Ganti nickname" aria-label="Ganti nickname"></button>
    <div class="who"><h2 id="dn"></h2>
      <div class="xp"><i id="xpb"></i></div>
      <div class="xpl"><span id="lvl"></span><span id="xpt"></span></div></div>
    <button class="icb" id="snd" aria-label="Suara"></button>
  </div>
  <div class="chips">
    <div class="chip"><b id="c1">0</b><span>Soal dikerjakan</span></div>
    <div class="chip"><b id="c2">0%</b><span>Akurasi</span></div>
    <div class="chip"><b id="c3">0</b><span>Sesi selesai</span></div>
  </div>
  <div class="sec"><svg class="ic"><use href="#i-flag"/></svg>Pilih Misi</div>
  <div class="missions">
    <button class="mc q" data-go="quiz"><span class="bi"><svg class="ic"><use href="#i-trophy"/></svg></span><span><h3>Quiz</h3><p>Mode ujian: ada waktu, tanpa pembahasan sampai selesai.</p></span></button>
    <button class="mc p" data-go="practice"><span class="bi"><svg class="ic"><use href="#i-target"/></svg></span><span><h3>Latihan Soal</h3><p>Langsung ada penjelasan dari AI di setiap soal.</p></span></button>
    <button class="mc j" data-go="chat"><span class="bi"><svg class="ic"><use href="#i-chat"/></svg></span><span><h3>Tanya Belajar</h3><p>Ngobrol dengan Joo AI: catatan materi, rumus, trik hafalan.</p></span></button>
  </div>
  <div class="sec"><svg class="ic"><use href="#i-sig"/></svg>Riwayat Terakhir</div>
  <div class="hist" id="hist"></div>
</section>

<section id="s-setup" class="screen">
  <div class="top"><button class="icb" data-go="dash" aria-label="Kembali"><svg class="ic"><use href="#i-back"/></svg></button><h2 id="sh"></h2></div>
  <div class="panel">
    <label class="l">Mata pelajaran</label><div class="seg sj" id="sg-sj"></div>
    <label class="l" for="sel">Materi / paket</label><select id="sel"></select><div class="hint" id="selh"></div>
    <label class="l">Tingkat kesulitan</label><div class="seg" id="sg-lv"></div>
    <label class="l">Jumlah soal</label><div class="seg" id="sg-ct"></div>
    <label class="l">Waktu</label><div class="seg" id="sg-tm"></div>
    <div class="err" id="serr"></div>
    <button class="btn full" id="go"><svg class="ic"><use href="#i-bolt"/></svg>Buat soal & mulai</button>
  </div>
</section>

<section id="s-load" class="screen"><div class="loader"><div class="spin"></div><h2 id="lt">AI lagi menyiapkan soal…</h2></div></section>

<section id="s-exam" class="screen">
  <div class="eh">
    <button class="icb" id="ex" aria-label="Keluar"><svg class="ic"><use href="#i-x"/></svg></button>
    <div class="mid" id="pg"></div>
    <div class="tm" id="tm"></div>
  </div>
  <div class="pb"><i id="pbi"></i></div>
  <div class="nav" id="nav"></div>
  <div class="qc"><div class="tag" id="qtag"></div><div class="fm" id="qfm" hidden></div><div class="pass" id="qps" hidden></div><h2 id="qt"></h2></div>
  <div class="opts" id="opts"></div>
  <div id="fbw"></div>
  <div class="bar">
    <button class="btn gho" id="prev"><svg class="ic"><use href="#i-back"/></svg>Sebelumnya</button>
    <button class="btn blu" id="padb" hidden><svg class="ic"><use href="#i-pen"/></svg>Kertas coret</button>
    <button class="btn" id="nx">Lanjut<svg class="ic"><use href="#i-next"/></svg></button>
  </div>
</section>

<section id="s-res" class="screen"><div class="panel res">
  <h2 id="rt"></h2>
  <div class="ring"><svg viewBox="0 0 120 120" width="170" height="170"><circle cx="60" cy="60" r="52" stroke="#0c0820"/><circle id="rc" cx="60" cy="60" r="52" stroke="#ffc933" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset 1.2s"/></svg><div class="big" id="rs"></div></div>
  <p id="rm"></p>
  <div class="stats"><div class="chip"><b id="r1"></b><span>Benar</span></div><div class="chip"><b id="r2"></b><span>Salah / kosong</span></div><div class="chip"><b id="r3"></b><span>XP didapat</span></div></div>
  <div class="rev" id="rev"></div>
  <div class="bar"><button class="btn gho" data-go="dash">Dashboard</button><button class="btn yel" id="again">Ulangi</button></div>
</div></section>

<section id="s-chat" class="screen">
  <div class="top"><button class="icb" data-go="dash" aria-label="Kembali"><svg class="ic"><use href="#i-back"/></svg></button><h2>Joo AI</h2></div>
  <div id="msgs"></div>
  <div class="sug" id="sug"></div>
  <form class="cf" id="cf"><input id="ci" placeholder="Tanya Joo AI…" maxlength="1500" autocomplete="off"><button class="btn yel" type="submit" aria-label="Kirim"><svg class="ic"><use href="#i-send"/></svg></button></form>
</section>
</div>

<div id="pad">
  <div class="pt">
    <span class="sp">Kertas Coret</span>
    <button id="t-pen" class="sel" aria-label="Pena"><svg class="ic"><use href="#i-pen"/></svg></button>
    <button id="t-er" aria-label="Penghapus"><svg class="ic"><use href="#i-eraser"/></svg></button>
    <button class="cl" style="background:#1d1240" data-c="#1d1240" aria-label="Hitam"></button>
    <button class="cl" style="background:#d6293e" data-c="#d6293e" aria-label="Merah"></button>
    <button class="cl" style="background:#1568d4" data-c="#1568d4" aria-label="Biru"></button>
    <button id="t-cl" aria-label="Bersihkan semua"><svg class="ic"><use href="#i-trash"/></svg></button>
    <button id="t-x" class="sel" aria-label="Tutup"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div id="pw"><canvas id="cv"></canvas></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
